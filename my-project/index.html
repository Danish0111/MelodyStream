<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MelodyStream-music for everyone</title>
  <link rel="stylesheet" href="/my-project/style.css">
  <link rel="stylesheet" href="/my-project/utility.css">
</head>

<body>
  <div class="container flex bg-black">

    <!-- left portion -->
    <div class="left">
      <div class="close">
        <img class="invert" src="/my-project/images/close.svg" alt="">
      </div>
      <div class="home bg-grey rounded m-1 p-1">
        <div class="logo">
          <img class="invert" style="width: 50px;" src="/my-project/images/logo2.jpeg" alt="">
          <span style="position: relative; bottom: 15px; right: 5px;">MelodyStream</span>
        </div>
        <ul>
          <li><img class="invert" src="/my-project/images/home.svg" alt="home">Home</li>
          <li><img class="invert" src="/my-project/images/search.svg" alt="search">Search</li>
        </ul>
      </div>
      <div class="library bg-grey rounded m-1 p-1">
        <div class="heading">
          <img class="invert" src="/my-project/images/library.svg" alt="">
          <h2>
            Your library
          </h2>
        </div>
        <div class="songlist">
          <ul>

          </ul>
        </div>

        <div class="footer p-1">
          <div>
            <a draggable="false" href="https://www.spotify.com/legal/cookies-policy/" target="_blank" rel="noopener">
              <span data-encore-id="text">Cookies</span>
            </a>
          </div>
          <div class="btn p-1">
            <button class="flex invert item-center gap justify-center">
              <span>
                <img src="/my-project/images/globe.svg" alt="">
              </span>
              English
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- right portion -->
    <div class="right bg-grey rounded">
      <div class="header">
        <div class="nav">
          <div class="svg">

            <img class="invert hamburger" src="/my-project/images/hamburger.svg" alt="">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M15 6L9 12L15 18" stroke="#ffffff" stroke-width="1.5" stroke-miterlimit="16" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M9.00005 6L15 12L9 18" stroke="#ffffff" stroke-width="1.5" stroke-miterlimit="16" />
            </svg>
          </div>
        </div>
        <div class="button">
          <button class="signupbtn">Sign up</button>
          <button class="loginbtn">Log in</button>
        </div>
      </div>
      <div class="spotifyPlaylist">
          <h1>Song Playlist</h1>
          <div class="card-container">
            
          </div>
          <div class="playbar">
            <div class="seekbar">
              <div class="circle"></div>
            </div>
            <div class="abovebar">
              <div class="songinfo"></div>
              <div class="songbuttons">
                <img id="previous" src="/my-project/images/prev.svg" alt="">
                <img id="play" src="/my-project/images/play.svg" alt="">
                <img id="next" src="/my-project/images/nextsong.svg" alt="">
              </div>
              <div class="songtime"></div>
            </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/my-project/script.js"></script>
</body>

</html>
